version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: prd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prd_admin
      POSTGRES_PASSWORD: prd_password
      POSTGRES_DB: prd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: