version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prd_postgres
    restart: always
    environment:
      POSTGRES_DB: prd_system_db
      POSTGRES_USER: prd_admin
      POSTGRES_PASSWORD: prd_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prd_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: prd_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: prd_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: prd_meilisearch
    restart: always
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=meili_master_key_2026

  wikijs:
    image: requarks/wiki:2
    container_name: prd_wikijs
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=prd_admin
      - DB_PASS=prd_secure_password_2026
      - DB_NAME=prd_system_db
    depends_on:
      - postgres

  gitea:
    image: gitea/gitea:1.21-rootless
    container_name: prd_gitea
    restart: always
    ports:
      - "3002:3000"
      - "2222:2222"

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: prd_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

volumes:
  postgres_data:
  minio_data:
